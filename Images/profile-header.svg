<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Kushal Panchali, AI engineer</title>
  <desc id="desc">A mi∃a memory retrieval example. A question about Postgres persistence leads to the Postgres node, follows its persists_with relationship to WAL, and returns that stored fact as context.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L7 4L1 7" stroke="#D6A17D" stroke-width="1.2"/>
    </marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#333530"/>
    </pattern>
    <linearGradient id="fade" x1="690" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#191C1A"/>
      <stop offset="1" stop-color="#222721"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="12" fill="#191C1A"/>
  <rect x="690" width="510" height="360" rx="12" fill="url(#fade)"/>
  <rect x="710" y="24" width="466" height="312" fill="url(#grid)"/>
  <path d="M48 48H80" stroke="#D6A17D" stroke-width="3"/>
  <text x="96" y="53" fill="#D6A17D" font-family="monospace" font-size="13" letter-spacing="3">KUSHAL2205A / AI ENGINEER</text>
  <text x="46" y="152" fill="#EEECE4" font-family="Georgia, serif" font-size="65" letter-spacing="-2">Kushal Panchali</text>
  <text x="49" y="203" fill="#C1C4BB" font-family="Arial, sans-serif" font-size="23">Memory, tools, and the</text>
  <text x="49" y="235" fill="#C1C4BB" font-family="Arial, sans-serif" font-size="23">systems around agents.</text>
  <text x="49" y="311" fill="#929E90" font-family="monospace" font-size="12" letter-spacing="2">VISAKHAPATNAM, INDIA</text>
  <text x="742" y="53" fill="#D6A17D" font-family="monospace" font-size="13" letter-spacing="2">mi∃a / MEMORY RETRIEVAL</text>
  <rect x="742" y="78" width="406" height="52" rx="6" fill="#222721" stroke="#465041"/>
  <text x="758" y="99" fill="#929E90" font-family="monospace" font-size="11" letter-spacing="1">QUERY</text>
  <text x="758" y="119" fill="#EEECE4" font-family="Arial, sans-serif" font-size="16">How does Postgres persist data?</text>
  <g stroke="#D6A17D" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M801 130V180"/>
    <path d="M860 204H1040"/>
    <path d="M1094 228V264"/>
  </g>
  <text x="814" y="160" fill="#929E90" font-family="monospace" font-size="12">find entry</text>
  <rect x="742" y="180" width="118" height="48" rx="6" fill="#292B24" stroke="#D6A17D"/>
  <rect x="1040" y="180" width="108" height="48" rx="6" fill="#292B24" stroke="#D6A17D"/>
  <g fill="#EEECE4" font-family="monospace" font-size="16" text-anchor="middle">
    <text x="801" y="210">Postgres</text>
    <text x="1094" y="210">WAL</text>
  </g>
  <text x="950" y="191" fill="#D6A17D" font-family="monospace" font-size="12" text-anchor="middle">persists_with</text>
  <rect x="742" y="266" width="406" height="59" rx="6" fill="#222721" stroke="#465041"/>
  <text x="758" y="287" fill="#929E90" font-family="monospace" font-size="11" letter-spacing="1">RETRIEVED CONTEXT</text>
  <text x="758" y="310" fill="#EEECE4" font-family="Arial, sans-serif" font-size="16">Postgres persists with write-ahead logging.</text>
</svg>
